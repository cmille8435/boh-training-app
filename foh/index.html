<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>FOH Training</title><link rel="manifest" href="manifest.json"><link rel="stylesheet" href="../style.css?v=64">
<style>.brand::before{display:none}.brand{gap:10px;min-width:0}.brand-logo{display:block;width:38px;height:38px;object-fit:contain;flex-shrink:0}.brand-label{line-height:1.3}@media(max-width:360px){header{gap:8px}.brand{gap:8px}.brand-logo{width:32px;height:32px}.ghost{padding:10px 12px}}
/* Opening animation: runs once per page load, never on section navigation. */
.app-opening{position:fixed;inset:0;z-index:20;display:grid;place-items:center;background:#fff;pointer-events:none;opacity:0;visibility:hidden}
.app-opening.opening-playing{animation:opening-exit 2s ease forwards}
.app-opening-content{text-align:center;padding:24px;animation:opening-enter .55s ease-out both}
.app-opening-logo{display:block;width:88px;height:88px;margin:0 auto 18px}
.app-opening-title{margin:0;color:#202630;font:850 24px/1.3 -apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif;letter-spacing:.02em}
.app-opening-subtitle{margin:8px 0 0;color:#667180;font:15px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif}
@keyframes opening-enter{from{opacity:0;transform:translateY(10px) scale(.94)}to{opacity:1;transform:translateY(0) scale(1)}}
@keyframes opening-exit{0%,68%{opacity:1;visibility:visible}100%{opacity:0;visibility:hidden}}
@media(prefers-reduced-motion:reduce){.app-opening-content{animation:none}}
.quality-photo-entry{display:flex;flex-direction:column;gap:6px;min-width:0}.quality-photo-entry .quality-photo-thumbnail{width:100%;flex:1}.quality-photo-entry>.ghost{width:100%;color:#aa0d27;font-size:12px;padding:8px;min-height:44px}.photo-editor{margin:24px 0;padding:16px;border:1px solid #e2e6eb;border-radius:12px;background:#fff}.photo-editor h2{margin:0 0 12px}.photo-editor-preview{display:block;width:100%;height:120px;object-fit:contain;border:1px solid #e2e6eb;border-radius:10px}

/* Presentation reflects the database role; RLS enforces the permissions. */
[hidden]{display:none!important}
body:not(.training-leader) .edit-actions:not(.auth-actions),body:not(.training-leader) .add-item,body:not(.training-leader) .section-heading>button,body:not(.training-leader) .quality-photo-entry>.ghost,body:not(.training-leader) [data-quality-order]{display:none!important}
.training-account{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:10px 20px;background:#fff;border-bottom:1px solid #e2e6eb;font-size:13px;overflow-wrap:anywhere}.training-account span{min-width:0}.training-account button{flex-shrink:0}
</style>
</head>
<body>
<div class="app-opening" aria-hidden="true"><div class="app-opening-content"><img class="app-opening-logo" src="../assets/cfa-logo.svg" alt="" width="88" height="88"><p class="app-opening-title">FOH Training</p><p class="app-opening-subtitle">Chick-fil-A Haywood Mall</p></div></div>
<header><div class="brand"><img class="brand-logo" src="../assets/cfa-logo.svg" alt="Chick-fil-A" width="38" height="38"><span class="brand-label">FOH TRAINING</span></div><button id="homeBtn" class="ghost">Home</button></header>
<main id="app"></main>
<nav><button data-nav="learn">Training</button><button data-nav="progress">My Progress</button><button data-nav="trainer">Trainer View</button></nav>
<script src="../training-access.js?v=7"></script><script src="../training-notifications.js?v=1"></script><script src="data.js?v=3"></script><script src="item-photos.js?v=74"></script><script src="app.js?v=access1"></script>
<script>
(function(){
  var opening=document.querySelector('.app-opening');
  if(!opening)return;
  var waiting=true;
  function playOpening(){
    if(!waiting||document.visibilityState!=='visible')return;
    waiting=false;
    opening.classList.remove('opening-playing');
    void opening.offsetWidth;
    opening.classList.add('opening-playing');
  }
  window.addEventListener('pageshow',function(){
    waiting=true;
    requestAnimationFrame(function(){requestAnimationFrame(playOpening);});
  });
  document.addEventListener('visibilitychange',playOpening);
})();
</script>
</body></html>
